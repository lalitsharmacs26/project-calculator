<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>Calculator</h1>

        <input type="number" id="firstNumber" placeholder="Enter first value">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>

        <input type="number" id="secondNumber" placeholder="Enter second value">

        <button onclick="calculate()">Calculate</button>

        <div id="result">Result: —</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
